<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Activity Challenge</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

  <section id="login-view" class="view active">
    <div class="login-card">
      <h1>🏆 Activity Challenge</h1>
      <p class="subtitle">Log an activity 3x a week, every week this month!</p>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Username" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Log In</button>
      </form>
      <p class="switch-link">No account? <a href="#" id="show-register">Create one</a></p>
    </div>
  </section>

  <section id="register-view" class="view">
    <div class="login-card">
      <h1>Create Account</h1>
      <form id="register-form">
        <input type="text" id="reg-username" placeholder="Username" required />
        <input type="password" id="reg-password" placeholder="Password" required />
        <label class="file-label">Profile picture
          <input type="file" id="reg-avatar" accept="image/*" />
        </label>
        <img id="reg-avatar-preview" class="avatar-preview" hidden />
        <button type="submit">Sign Up</button>
      </form>
      <p class="switch-link">Already have an account? <a href="#" id="show-login">Log in</a></p>
    </div>
  </section>

  <section id="dashboard-view" class="view">
    <header class="topbar">
      <h1>This Month's Leaderboard</h1>
      <div class="topbar-actions">
        <span id="welcome-msg"></span>
        <button id="logout-btn">Log out</button>
      </div>
    </header>
    <main class="dashboard-main">
      <div class="chart-card"><canvas id="leaderboard-chart"></canvas></div>
      <button id="log-activity-btn" class="fab-log-btn">📸 Log Activity</button>
      <h2 class="section-title">Participants</h2>
      <div class="carousel-wrapper">
        <button class="carousel-arrow left" id="carousel-left">&#10094;</button>
        <div class="carousel" id="carousel"></div>
        <button class="carousel-arrow right" id="carousel-right">&#10095;</button>
      </div>
    </main>
  </section>

  <section id="user-detail-view" class="view">
    <header class="topbar">
      <button id="back-to-dashboard">&#8592; Back</button>
      <h1 id="detail-username"></h1>
      <div></div>
    </header>
    <main class="detail-main">
      <div class="detail-avatar-wrapper">
        <img id="detail-avatar" class="detail-avatar" />
        <label id="change-avatar-btn" class="change-avatar-btn" hidden>
          📷
          <input type="file" id="change-avatar-input" accept="image/*" hidden />
        </label>
      </div>
      <p id="detail-progress"></p>
      <div class="progress-bar-outer"><div id="detail-progress-fill" class="progress-bar-inner"></div></div>
      <h3>Logged Activities</h3>
      <div id="detail-activity-list" class="activity-grid"></div>
    </main>
  </section>

  <div id="log-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <h2>Log an Activity</h2>
      <div class="capture-options">
        <label class="capture-btn">📷 Take Photo
          <input type="file" id="capture-camera" accept="image/*" capture="environment" hidden />
        </label>
        <label class="capture-btn">🖼️ Choose from Gallery
          <input type="file" id="capture-gallery" accept="image/*" hidden />
        </label>
      </div>
      <img id="capture-preview" class="capture-preview" hidden />
      <input type="text" id="capture-note" placeholder="Add a note (optional)" />
      <div class="modal-actions">
        <button id="capture-cancel" class="secondary">Cancel</button>
        <button id="capture-submit" disabled>Submit</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
