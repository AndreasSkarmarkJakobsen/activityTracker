version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: activity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: activity
      POSTGRES_PASSWORD: activity_pass
      POSTGRES_DB: activity_challenge
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activity -d activity_challenge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: activity-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://activity:activity_pass@db:5432/activity_challenge
      JWT_SECRET: change_this_secret_in_production
      PORT: 3000
      ADMIN_PORT: 3001
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data:
